[bootstrap.packages]
"apt:git" = "latest"
"apt:sed" = "latest"
"apt:7zip" = "latest"
"apt:poppler-utils" = "latest"
"apt:poppler-data" = "latest"
"apt:build-essential" = "latest"

"apk:git" = "latest"
"apk:sed" = "latest"
"apk:7zip" = "latest"
"apk:poppler" = "latest"
"apk:poppler-data" = "latest"
"apk:build-base" = "latest"

"pacman:git" = "latest"
"pacman:sed" = "latest"
"pacman:7zip" = "latest"
"pacman:poppler" = "latest"
"pacman:poppler-data" = "latest"
"pacman:base-devel" = "latest"

[tools]
# Lang
bun = "latest"
node = "latest"
go = "latest"
python = "latest"
rust = "latest"
uv = "latest"

dotnet = { version = "latest", os = ["linux", "macos"] }

# AI
claude = "latest"
opencode = "latest"
pi = "latest"
apm = "latest"

# Git
delta = "latest"
github-cli = "latest"
glab = "latest"
lazygit = "latest"

# Yazi and deps
yazi = "latest"
ffmpeg = "latest"
resvg = "latest"

# Utils
"github:1broseidon/ketch" = "latest"
"github:BurntSushi/xsv" = "latest"
"github:sharkdp/vivid" = "latest"
"github:sharkdp/pastel" = "latest"
"github:agavra/tuicr" = "latest"
"pipx:posting" = "latest"
"pipx:sqlit-tui" = "latest"

bat = "latest"
bitwarden = "latest"
croc = "latest"
doggo = "latest"
duf = "latest"
dust = "latest"
eza = "latest"
fastfetch = "latest"
fd = "latest"
fx = "latest"
fzf = "latest"
glow = "latest"
gum = "latest"
hyperfine = "latest"
jq = "latest"
neovim = "latest"
oha = "latest"
qsv = "latest"
ripgrep = "latest"
sd = "latest"
starship = "latest"
television = "latest"
yq = "latest"
yt-dlp = "latest"
zoxide = "latest"

atuin = { version = "latest", os = ["linux", "macos"] }
"cargo:xan" = { version = "latest", os = ["linux", "macos"] }
bat-extras = { version = "latest", os = ["linux", "macos"] }
btop = { version = "latest", os = ["linux", "macos"] }
herdr = { version = "latest", os = ["linux", "macos"] }
imagemagick = { version = "latest", os = ["linux", "macos"] }
tmux = { version = "latest", os = ["linux", "macos"] }
viddy = { version = "latest", os = ["linux", "macos"] }

[env]
FX_THEME = "9"
FX_SHOW_SIZE = "true"
FX_LINE_NUMBERS = "true"

[settings]
dotfiles.root = "~/.dotfiles"
dotfiles.default_mode = "symlink"
github.credential_command = "gh auth token"

[dotfiles]
# Git
"~/.gitconfig" = "~/.dotfiles/common/config/git/.gitconfig"
"~/.gitignore_global" = "~/.dotfiles/common/config/git/.gitignore_global"
# Editors
"~/.vimrc" = "~/.dotfiles/common/config/vim/.vimrc"
# "~/.config/nvim" = "~/.dotfiles/common/config/nvim"
# Shell & prompt
# "~/.bashrc" = "~/.dotfiles/linux/config/bash/bashrc"
"~/.config/starship.toml" = "~/.dotfiles/common/config/starship/starship.toml"
"~/.config/mise/config.toml" = "~/.dotfiles/common/config/mise/mise.toml"
"~/.config/mise/miserc.toml" = "~/.dotfiles/linux/config/mise/miserc.toml"
"~/.curlrc" = "~/.dotfiles/common/config/curl/.curlrc"
"~/.claude/settings.json" = "~/.dotfiles/common/config/claude/settings.json"
"~/.config/opencode/opencode.json" = "~/.dotfiles/common/config/opencode/opencode.json"
"~/.config/opencode/tui.json" = "~/.dotfiles/common/config/opencode/tui.json"
"~/.config/hunk/config.toml" = "~/.dotfiles/common/config/hunk/config.toml"
"~/.apm/apm.yml" = "~/.dotfiles/common/config/apm/apm.yml"
"~/.config/yazi/" = "~/.dotfiles/common/config/yazi/"
# Kanata
"~/.config/kanata/kanata.kbd" = "~/.dotfiles/common/config/kanata/laptop.kbd"
