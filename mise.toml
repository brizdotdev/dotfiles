[settings]
dotfiles.root = "~/.dotfiles"
dotfiles.default_mode = "symlink"

[dotfiles]
# Git
"~/.gitconfig" = "common/config/git/.gitconfig"
"~/.gitignore_global" = "common/config/git/.gitignore_global"
# Editors
"~/.vimrc" = "common/config/vim/.vimrc"
"~/.config/nvim" = "common/config/nvim"
# Shell & prompt
"~/.bashrc" = "linux/config/bash/bashrc"
"~/.config/starship.toml" = "common/config/starship/starship.toml"
# Terminal
"~/.tmux.conf" = "linux/config/tmux/.tmux.conf"
"~/.tmux/plugins/tpm" = "linux/config/tmux/tpm"
# Tools
"~/.config/lazygit/config.yml" = "common/config/lazygit/config.yml"
"~/.curlrc" = "common/config/curl/.curlrc"
"~/.claude/settings.json" = "common/config/claude/settings.json"